<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Desk · sign in</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--line:#e2e1dc;--tx:#141413;--mut:#6f6e68;--acc:#2a6fd6;--err:#c43c3b}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--card:#21211f;--line:#353532;--tx:#f2f1ec;--mut:#9b9a92;--acc:#5b95ec;--err:#f0706e}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:16px}
form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 20px;color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{margin-top:20px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 15px inherit;cursor:pointer}
.err{color:var(--err);font-size:13px;margin:12px 0 0}
</style></head><body>
<form method="post" action="/login" autocomplete="on">
  <h1>Data Desk</h1>
  <p class="sub">Private analyst over your collected data, running on the orchestrator laptop.</p>
  <label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <!--msg-->
</form>
</body></html>
